<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not Found</title>
<link rel="stylesheet" href="/static/admin-stats.css">
</head>
<body>
<!-- Served with status 404. Stays a plain "Not Found" unless /api/admin/stats answers,
     which it does only for an ADMIN_EMAILS account signed in on this site (sign in on /ghostcart). -->
<pre id="notfound">{"detail":"Not Found"}</pre>
<main id="dash" hidden>
  <header class="head">
    <div>
      <h1>GhostCart usage</h1>
      <p class="sub" id="meta"></p>
    </div>
    <button type="button" id="refresh" class="btn">Reload</button>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2>Valid users, cumulative</h2>
    <p class="hint" id="users-hint"></p>
    <div class="chart" id="chart-cumulative"></div>
  </section>

  <section class="card">
    <h2>New valid users per day</h2>
    <div class="chart" id="chart-new"></div>
  </section>

  <section class="card">
    <h2>Searches per day</h2>
    <div class="legend" id="legend-searches"></div>
    <div class="chart" id="chart-searches"></div>
  </section>

  <section class="card" id="notes-card" hidden>
    <h2>About these numbers</h2>
    <ul id="notes"></ul>
  </section>

  <section class="card">
    <details>
      <summary>Table view</summary>
      <div class="table-wrap"><table id="table"></table></div>
    </details>
  </section>

  <p class="foot" id="foot"></p>
</main>
<div id="tip" class="tip" hidden></div>
<script type="module" src="/static/admin-stats.js"></script>
</body>
</html>
